<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="circleBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#06b6d4" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Outer Ring -->
  <circle cx="100" cy="100" r="94" fill="#020617" stroke="url(#circleBorder)" stroke-width="4" filter="url(#glow)" />
  
  <!-- Inner Background Circle -->
  <circle cx="100" cy="100" r="86" fill="url(#bgGrad)" opacity="0.15" />
  
  <!-- Subtle inner dashed accent -->
  <circle cx="100" cy="100" r="82" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.4" />

  <!-- Monogram Logo "WW" & Trophy Accent -->
  <g fill="none" stroke="url(#bgGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <!-- Stylized W 1 -->
    <path d="M 52 75 L 68 128 L 84 85 L 100 128 L 116 85 L 132 128 L 148 75" stroke="#38bdf8" stroke-width="9" />
  </g>

  <!-- Star Accent on Top -->
  <polygon points="100,42 104,54 116,54 106,62 110,74 100,66 90,74 94,62 84,54 96,54" fill="#fbbf24" stroke="#f59e0b" stroke-width="1.5" />
  
  <!-- Small Bottom Subtitle / Dots -->
  <circle cx="82" cy="150" r="3" fill="#38bdf8" />
  <circle cx="100" cy="150" r="4.5" fill="#a855f7" />
  <circle cx="118" cy="150" r="3" fill="#38bdf8" />
</svg>
